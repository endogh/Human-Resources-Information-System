server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:9090}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authCircuitBreaker
                fallbackUri: forward:/fallback/authservice

        - id: admin-service
          uri: ${ADMIN_SERVICE_URI:http://localhost:9091}
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - name: CircuitBreaker
              args:
                name: adminCircuitBreaker
                fallbackUri: forward:/fallback/adminservice

        - id: company-service
          uri: ${COMPANY_SERVICE_URI:http://localhost:9092}
          predicates:
            - Path=/api/v1/company/**
          filters:
            - name: CircuitBreaker
              args:
                name: companyCircuitBreaker
                fallbackUri: forward:/fallback/companyservice

        - id: company-admin-service
          uri: ${COMPANY_ADMIN_SERVICE_URI:http://localhost:9093}
          predicates:
            - Path=/api/v1/companyadmin/**
          filters:
            - name: CircuitBreaker
              args:
                name: companyAdminCircuitBreaker
                fallbackUri: forward:/fallback/companyadminservice

        - id: personal-service
          uri: ${PERSONAL_SERVICE_URI:http://localhost:9094}
          predicates:
            - Path=/api/v1/personal/**
          filters:
            - name: CircuitBreaker
              args:
                name: personalCircuitBreaker
                fallbackUri: forward:/fallback/personalservice

        # GET-only reads for advancepayment/dayoff/expenditure go to Elastic (
        # ElasticMicroService); the request-service route below still handles
        # the write paths (save/update/delete/confirm/decline/accept).
        - id: elastic-service
          uri: ${ELASTIC_SERVICE_URI:http://localhost:9100}
          predicates:
            - Path=/api/v1/advancepayment/**,/api/v1/dayoff/**,/api/v1/expenditure/**
            - Method=GET
          filters:
            - name: CircuitBreaker
              args:
                name: elasticCircuitBreaker
                fallbackUri: forward:/fallback/elasticservice

        - id: request-service
          uri: ${REQUEST_SERVICE_URI:http://localhost:9095}
          predicates:
            - Path=/api/v1/advancepayment/**,/api/v1/dayoff/**,/api/v1/expenditure/**
          filters:
            - name: CircuitBreaker
              args:
                name: requestCircuitBreaker
                fallbackUri: forward:/fallback/requestservice

resilience4j:
  timelimiter:
    configs:
      default:
        timeout-duration: 10s
        cancel-running-future: true
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5