services:
  postgres:
    image: postgres:15-alpine
    container_name: hris-postgres
    environment:
      POSTGRES_USER: hris
      POSTGRES_PASSWORD: hris
      POSTGRES_DB: hris
    ports:
      - "5432:5432"
    volumes:
      - hris-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hris"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:6
    container_name: hris-mongo
    ports:
      - "27017:27017"
    volumes:
      - hris-mongodata:/data/db

  redis:
    image: redis:7-alpine
    container_name: hris-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: hris-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.10
    container_name: hris-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - hris-esdata:/usr/share/elasticsearch/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: hris-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  hris-pgdata:
  hris-mongodata:
  hris-esdata:
